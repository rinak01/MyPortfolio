<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Najeon chilgi — moonrise toggle</title>
<style>
  :root{
    --gold:#d8b878;
    --gold-line:rgba(216,184,120,.4);
    --ink:#05060c;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    background:#141318;
    font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    padding:32px 16px;
    transition:background 1.1s ease;
  }
  body.is-day{background:#e9e0e4}

  .card{width:392px;max-width:100%}

  .scene{
    position:relative; width:100%; height:428px;
    border-radius:22px; overflow:hidden; cursor:pointer;
    border:1px solid var(--gold-line);
    box-shadow:inset 0 0 60px rgba(0,0,0,.55), 0 18px 50px rgba(0,0,0,.45);
    -webkit-tap-highlight-color:transparent;
  }
  .scene:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

  .sky{position:absolute;inset:0;transition:opacity 1.1s ease}
  .sky-night{background:linear-gradient(180deg,#05060c 0%,#0b1022 55%,#0a0a12 100%);opacity:1}
  .sky-day{background:linear-gradient(180deg,#efe6f2 0%,#e6d7e8 40%,#dcc7cf 72%,#cbb6b2 100%);opacity:0}
  .is-day .sky-night{opacity:0}
  .is-day .sky-day{opacity:1}

  .stars{
    position:absolute; top:0; left:0; width:2px; height:2px; border-radius:50%;
    background:#fff; opacity:1; transition:opacity 1.1s ease;
    animation:twinkle 4s ease-in-out infinite;
    box-shadow:
      42px 38px 0 0 rgba(255,255,255,.9),
      126px 74px 0 0 rgba(243,236,255,.75),
      318px 52px 0 0 rgba(255,255,255,.8),
      356px 128px 0 0 rgba(255,233,200,.7),
      74px 176px 0 0 rgba(255,255,255,.55),
      292px 208px 0 0 rgba(243,236,255,.6),
      182px 26px 0 0 rgba(255,255,255,.65),
      248px 96px 0 0 rgba(255,233,200,.5);
  }
  .is-day .stars{opacity:0}
  @keyframes twinkle{0%,100%{opacity:.35}50%{opacity:1}}

  .moon-wrap{
    position:absolute; left:50%; margin-left:-84px; top:40px;
    width:168px; height:168px;
    transition:top 1.3s cubic-bezier(.45,0,.2,1);
  }
  .is-day .moon-wrap{top:262px}

  .moon{
    position:absolute; inset:0; border-radius:50%;
    animation:drift 7s ease-in-out infinite;
  }
  @keyframes drift{0%,100%{transform:translateY(-6px)}50%{transform:translateY(6px)}}

  .shard{position:absolute;width:11px;height:11px;pointer-events:none;
    clip-path:polygon(50% 0%,78% 22%,100% 58%,62% 100%,22% 84%,0% 40%);
    animation:burst var(--dur) cubic-bezier(.2,.7,.3,1) forwards;}
  @keyframes burst{
    0%{transform:translate(0,0) scale(.4) rotate(0deg);opacity:1}
    100%{transform:translate(var(--dx),var(--dy)) scale(1.1) rotate(var(--rot));opacity:0}
  }

  .caption{
    display:flex; align-items:baseline; justify-content:space-between;
    margin-top:18px; padding:0 4px;
  }
  .label{
    font-size:12px; letter-spacing:.28em; text-transform:uppercase;
    color:rgba(232,224,236,.72); transition:color 1.1s ease;
    font-family:ui-sans-serif,system-ui,sans-serif;
  }
  .is-day .label{color:rgba(58,44,48,.75)}
  .hanja{font-size:15px;letter-spacing:.1em;color:var(--gold)}

  @media (prefers-reduced-motion:reduce){
    .moon,.stars{animation:none}
    .sky,.moon-face,.moon-wrap,.sea-glaze,.label,body{transition-duration:.01ms}
    .shard{display:none}
  }
</style>
</head>
<body>
  <div class="card">
    <div class="scene" id="scene" role="switch" aria-checked="true" aria-label="Night mode" tabindex="0">
      <div class="sky sky-night"></div>
      <div class="sky sky-day"></div>
      <div class="stars"></div>
      <div class="moon-wrap">
        <div class="moon">
          <div class="moon-face moon-pearl"></div>
          <div class="moon-face moon-lacquer"></div>
          <div class="moon-ring"></div>
        </div>
      </div>
      <div class="horizon"></div>
      <div class="sea"><div class="sea-glaze"></div></div>
    </div>
    <div class="caption">
      <span class="label" id="label">Night mode</span>
      <span class="hanja" id="hanja">月</span>
    </div>
  </div>

<script>
  var scene = document.getElementById('scene');
  var label = document.getElementById('label');
  var hanja = document.getElementById('hanja');
  var night = true;
  var tints = ['#f6f0ff','#dff6ee','#ffe9c8','#f0dcf2','#cfe6ff','#fff6e2'];

  function burst(x, y){
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    for (var i = 0; i < 18; i++){
      var s = document.createElement('div');
      s.className = 'shard';
      var a = Math.random() * Math.PI * 2;
      var d = 40 + Math.random() * 90;
      s.style.left = x + 'px';
      s.style.top = y + 'px';
      s.style.setProperty('--dx', Math.cos(a) * d + 'px');
      s.style.setProperty('--dy', Math.sin(a) * d + 'px');
      s.style.setProperty('--rot', Math.round(Math.random() * 540 - 270) + 'deg');
      s.style.setProperty('--dur', (700 + Math.random() * 500) + 'ms');
      var c1 = tints[Math.floor(Math.random() * tints.length)];
      var c2 = tints[Math.floor(Math.random() * tints.length)];
      s.style.background = 'linear-gradient(135deg,' + c1 + ',' + c2 + ')';
      s.style.boxShadow = '0 0 7px rgba(216,184,120,.75)';
      scene.appendChild(s);
      (function(el){ setTimeout(function(){ el.remove(); }, 1300); })(s);
    }
  }

  function toggle(x, y){
    night = !night;
    document.body.classList.toggle('is-day', !night);
    scene.classList.toggle('is-day', !night);
    scene.setAttribute('aria-checked', night ? 'true' : 'false');
    scene.setAttribute('aria-label', night ? 'Night mode' : 'Day mode');
    label.textContent = night ? 'Night mode' : 'Day mode';
    hanja.textContent = night ? '月' : '日';
    burst(x, y);
  }

  scene.addEventListener('click', function(e){
    var r = scene.getBoundingClientRect();
    toggle(e.clientX - r.left, e.clientY - r.top);
  });
  scene.addEventListener('keydown', function(e){
    if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); toggle(196, 214); }
  });
</script>
</body>
</html>
