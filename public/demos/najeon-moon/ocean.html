  .sparkle{animation:sparkle 6s ease-in-out infinite}

  @keyframes sparkle{0%,100%{opacity:.7}50%{opacity:1}}

    color:rgba(232,224,236,.5);font-weight:400;margin:0 0 11px}
  .row{display:flex;align-items:center;gap:10px;margin-bottom:9px}
  .row label{font-size:12px;color:rgba(232,224,236,.72);width:100px;flex-shrink:0}
  .row input[type=range]{flex:1;height:3px;-webkit-appearance:none;appearance:none;
    background:rgba(216,184,120,.22);border-radius:2px;outline:none}
  .row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;
    border-radius:50%;background:#d8b878;cursor:pointer;border:none}
  .row input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;
    background:#d8b878;cursor:pointer;border:none}
  .row output{font-size:11px;color:rgba(216,184,120,.85);width:40px;text-align:right;
    font-variant-numeric:tabular-nums}
  .btns{display:flex;gap:8px;margin-top:8px}
  button{flex:1;padding:9px 8px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;
    background:transparent;color:rgba(232,224,236,.8);border:1px solid rgba(216,184,120,.38);
    border-radius:7px;cursor:pointer;font-family:inherit}
  button:hover{background:rgba(216,184,120,.1)}
  #dump{width:100%;height:96px;margin-top:12px;background:rgba(0,0,0,.4);
    color:rgba(232,224,236,.72);border:1px solid rgba(216,184,120,.2);border-radius:7px;
    padding:9px;font-family:ui-monospace,monospace;font-size:10px;line-height:1.5;resize:vertical}
  @media (prefers-reduced-motion:reduce){ .breathe,.sparkle{animation:none} }

<body>
  <div class="stage">
    <div class="ocean" id="ocean">
      <div class="ott"></div>
      <div class="far"></div>
      <div class="far-blend"></div>
      <div class="mid" id="mid"></div>
      <svg class="strokes" id="strokes" viewBox="0 0 760 620" preserveAspectRatio="none" aria-hidden="true"></svg>
      <div class="dot breathe" id="flecks"></div>
      <div class="dot breathe" id="gold"></div>
      <div class="dot" id="discs"></div>
      <div class="dot sparkle" id="sparks"></div>
      <div class="dot sparkle" id="glints"></div>
      <div class="sink" id="sink"></div>
      <div class="gloss"></div>
    </div>
  </div>

  <div class="panel">
    <h2>Expand ocean</h2>

    <div class="grp">
      <h3>Perspective</h3>
      <div class="row"><label>Falloff</label><input type="range" id="persp" min="0" max="100" value="52" step="1"><output id="o_persp">52</output></div>
      <div class="row"><label>Horizon</label><input type="range" id="horizon" min="40" max="300" value="150" step="2"><output id="o_horizon">150</output></div>
      <div class="row"><label>Sink into black</label><input type="range" id="sinkv" min="20" max="100" value="64" step="2"><output id="o_sinkv">64</output></div>
      <div class="row"><label>Mid blend</label><input type="range" id="midop" min="0" max="100" value="70" step="2"><output id="o_midop">70</output></div>
    </div>

    <div class="grp">
      <h3>Moonpath</h3>
      <div class="row"><label>Sparks</label><input type="range" id="nspark" min="0" max="220" value="96" step="4"><output id="o_nspark">96</output></div>
      <div class="row"><label>Reach</label><input type="range" id="reach" min="10" max="100" value="46" step="2"><output id="o_reach">46</output></div>
      <div class="row"><label>Spread</label><input type="range" id="spread" min="10" max="200" value="86" step="2"><output id="o_spread">86</output></div>
      <div class="row"><label>Brightness</label><input type="range" id="sbright" min="20" max="150" value="100" step="2"><output id="o_sbright">100</output></div>
    </div>

    <div class="grp">
      <h3>Secondary glints</h3>
      <div class="row"><label>Count</label><input type="range" id="nglint" min="0" max="60" value="16" step="1"><output id="o_nglint">16</output></div>
      <div class="row"><label>Reach</label><input type="range" id="greach" min="10" max="100" value="52" step="2"><output id="o_greach">52</output></div>
    </div>

    <div class="grp">
      <h3>Surface</h3>
      <div class="row"><label>Wave strokes</label><input type="range" id="nwave" min="0" max="90" value="34" step="1"><output id="o_nwave">34</output></div>
      <div class="row"><label>Pearl flecks</label><input type="range" id="nfine" min="0" max="300" value="110" step="4"><output id="o_nfine">110</output></div>
      <div class="row"><label>Gold flecks</label><input type="range" id="ngold" min="0" max="100" value="30" step="2"><output id="o_ngold">30</output></div>
      <div class="row"><label>Shell discs</label><input type="range" id="ndisc" min="0" max="40" value="13" step="1"><output id="o_ndisc">13</output></div>
      <div class="row"><label>Element reach</label><input type="range" id="ereach" min="10" max="100" value="58" step="2"><output id="o_ereach">58</output></div>
    </div>

    <div class="btns">
      <button id="reseed">Reseed</button>
      <button id="reset">Reset</button>
    </div>
    <textarea id="dump" readonly></textarea>
  </div>

<script>
var seed = 11;
function rnd(){ seed = (seed*1664525 + 1013904223) % 4294967296; return seed/4294967296; }
function ri(a,b){ return Math.floor(a + rnd()*(b-a+1)); }
function pick(a){ return a[Math.floor(rnd()*a.length)]; }
function rgba(c,a){ return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a.toFixed(2)+')'; }

var W=760, H=620;
var pearlT=[[232,240,255],[216,236,228],[244,232,246],[255,244,214],[206,226,246],[238,222,236]];
var goldT=[[226,182,104],[240,206,132],[206,164,86]];
var discT=[[226,236,246],[214,232,224],[240,228,240],[228,196,138],[206,222,242]];
var sparkT=[[255,255,255],[236,244,255],[255,246,222],[224,240,236]];

var ids=['persp','horizon','sinkv','midop','nspark','reach','spread','sbright',
         'nglint','greach','nwave','nfine','ngold','ndisc','ereach'];
var els={}; ids.forEach(function(i){ els[i]=document.getElementById(i); });
function v(i){ return parseFloat(els[i].value); }

function render(){
  var s0 = seed;
  ids.forEach(function(i){ document.getElementById('o_'+i).textContent = els[i].value; });

  var hz = v('horizon'), P = v('persp')/100;
  var span = H - hz;

  document.querySelector('.far').style.height = hz+'px';
  document.querySelector('.far-blend').style.height = hz+'px';
  var mid = document.getElementById('mid');
  mid.style.top = Math.round(hz*0.78)+'px';
  mid.style.opacity = (v('midop')/100).toFixed(2);

  var sk = v('sinkv')/100;
  document.getElementById('sink').style.top = hz+'px';
  document.getElementById('sink').style.background =
    'linear-gradient(180deg, rgba(1,1,2,0) 0%, rgba(1,1,2,'+(.30*sk*1.5).toFixed(2)+') 22%,'+
    ' rgba(1,1,2,'+(.62*sk*1.5).toFixed(2)+') 44%, rgba(1,1,2,'+Math.min(1,.86*sk*1.5).toFixed(2)+') 64%,'+
    ' rgba(1,1,2,'+Math.min(1,.97*sk*1.5).toFixed(2)+') 82%, #010102 100%)';

  // t = 0 at horizon, 1 at bottom. scale grows with t by perspective amount.
  function scaleAt(t){ return 1 + t*t*(0.6 + P*3.2); }

  var fine=[], gold=[], discs=[], sparks=[], glints=[];
  var er = v('ereach')/100;

  for (var i=0;i<v('nfine');i++){
    var t = Math.pow(rnd(), 0.55);
    if (t > er) continue;
    var y = hz + t*span, sc = scaleAt(t);
    var a = (0.6+rnd()*0.35) * (1 - t/er*0.8);
    fine.push(ri(0,W)+'px '+Math.round(y)+'px 0 '+(rnd()<0.25?1:0)*Math.round(sc-1)+'px '+rgba(pick(pearlT), Math.max(0,a)));
  }
  for (i=0;i<v('ngold');i++){
    t = Math.pow(rnd(), 0.55);
    if (t > er) continue;
    y = hz + t*span; sc = scaleAt(t);
    a = (0.6+rnd()*0.3) * (1 - t/er*0.8);
    gold.push(ri(0,W)+'px '+Math.round(y)+'px 0 0 '+rgba(pick(goldT), Math.max(0,a)));
  }
  for (i=0;i<v('ndisc');i++){
    t = Math.pow(rnd(), 0.7);
    if (t > er) continue;
    y = hz + t*span; sc = scaleAt(t);
    var rad = Math.max(1, Math.round(pick([2,3,3,4,5])*sc));
    a = (0.4+rnd()*0.15) * (1 - t/er*0.75);
    discs.push(ri(6,W-10)+'px '+Math.round(y)+'px 0 '+rad+'px '+rgba(pick(discT), Math.max(0,a)));
  }

  var ns=v('nspark'), rc=v('reach')/100, sp=v('spread'), sb=v('sbright')/100;
  for (i=0;i<ns;i++){
    t = Math.pow(rnd(), 0.6);
    if (t > rc) continue;
    y = hz + t*span;
    var w = 8 + t*sp*scaleAt(t)*0.6;
    var x = Math.round(W/2 + (rnd()*2-1)*w);
    var fade = 1 - Math.pow(t/rc, 1.6);
    a = Math.min(1, (0.35+rnd()*0.65) * fade * sb);
    sparks.push(x+'px '+Math.round(y)+'px 0 '+(rnd()<0.3?1:0)+'px '+rgba(pick(sparkT), Math.max(0,a)));
  }

  var ng=v('nglint'), gr=v('greach')/100;
  for (i=0;i<ng;i++){
    t = Math.pow(rnd(), 0.65);
    if (t > gr) continue;
    y = hz + t*span;
    var side = rnd()<0.5 ? -1 : 1;
    x = Math.round(W/2 + side*(90 + rnd()*(W/2-70)));
    a = (0.3+rnd()*0.4) * (1 - Math.pow(t/gr,1.5)) * sb * 0.7;
    glints.push(x+'px '+Math.round(y)+'px 0 '+(rnd()<0.4?1:0)+'px '+rgba(pick(sparkT), Math.max(0,a)));
  }

  document.getElementById('flecks').style.boxShadow = fine.join(',')||'none';
  document.getElementById('gold').style.boxShadow   = gold.join(',')||'none';
  document.getElementById('discs').style.boxShadow  = discs.join(',')||'none';
  document.getElementById('sparks').style.boxShadow = sparks.join(',')||'none';
  document.getElementById('glints').style.boxShadow = glints.join(',')||'none';

  var svg='', nw=v('nwave');
  for (i=0;i<nw;i++){
    t = Math.pow(rnd(), 0.5);
    if (t > er) continue;
    y = hz + t*span; sc = scaleAt(t);
    var len = (30 + rnd()*150) * sc;
    x = rnd()*W - len*0.3;
    var op = (0.10+rnd()*0.30) * (1 - Math.pow(t/er,1.4));
    var col = pick(['#cfd8ea','#d8cfe4','#e0d4c0','#c8dcd4']);
    var dip = (rnd()*2-1) * 2.2 * sc;
    svg += '<path d="M'+x.toFixed(1)+' '+y.toFixed(1)+' q'+(len/2).toFixed(1)+' '+dip.toFixed(1)+' '+len.toFixed(1)+' 0" fill="none" stroke="'+col+'" stroke-width="'+(0.6*Math.min(sc,2.4)).toFixed(2)+'" stroke-linecap="round" opacity="'+Math.max(0,op).toFixed(2)+'"/>';
  }
  document.getElementById('strokes').innerHTML = svg;

  seed = s0;

  document.getElementById('dump').value =
    'perspective '+v('persp')+'  horizon '+hz+'px  sink '+v('sinkv')+'  midblend '+v('midop')+'\n'+
    'moonpath    '+ns+' sparks  reach '+v('reach')+'  spread '+sp+'  bright '+v('sbright')+'\n'+
    'glints      '+ng+'  reach '+v('greach')+'\n'+
    'surface     waves '+nw+'  pearl '+v('nfine')+'  gold '+v('ngold')+'  discs '+v('ndisc')+'  reach '+v('ereach');
}

ids.forEach(function(i){ els[i].addEventListener('input', render); });
document.getElementById('reseed').addEventListener('click', function(){
  seed = Math.floor(Math.random()*4294967296); render();
});
var defs={persp:52,horizon:150,sinkv:64,midop:70,nspark:96,reach:46,spread:86,sbright:100,
  nglint:16,greach:52,nwave:34,nfine:110,ngold:30,ndisc:13,ereach:58};
document.getElementById('reset').addEventListener('click', function(){
  for(var k in defs) els[k].value=defs[k]; seed=11; render();
});
render();
</script>
</body>
</html>
